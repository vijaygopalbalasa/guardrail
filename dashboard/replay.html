<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardrail Replay</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%222%22 y=%222%22 width=%2212%22 height=%2212%22 rx=%223%22 fill=%22%233ecf8e%22/%3E%3C/svg%3E">
<style>
  :root { --bg: #0d0f12; --panel: #15181d; --line: #252a31; --text: #e8eaed; --muted: #8b93a1; --ok: #3ecf8e; --no: #ff6b5e; --warn: #f5b84b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f6f7f9; --panel: #fff; --line: #e3e6ea; --text: #15181d; --muted: #5f6776; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 6px; } h1 span { color: var(--muted); font-weight: 400; }
  .replay-badge { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 2px 8px; margin-right: 8px; }
  .label { color: var(--muted); font-size: 13px; margin: 8px 0 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
  button, select { font: inherit; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  input[type=range] { flex: 1; min-width: 160px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  .rp-title { font-weight: 700; font-size: 16px; }
  .big { font-size: 48px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; margin-top: 10px; }
  .big.no { color: var(--no); } .big.ok { color: var(--ok); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .track { height: 10px; background: color-mix(in srgb, var(--line) 70%, transparent); border-radius: 5px; overflow: hidden; margin: 10px 0 12px; }
  .fill { height: 100%; background: var(--no); transition: width .35s ease; } .fill.okfill { background: var(--ok); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 13px; margin: 8px 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .rp-list { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; max-height: 220px; overflow: auto; }
  .rp-list li { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 4px; }
  .tag.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .tag.no { background: color-mix(in srgb, var(--no) 16%, transparent); color: var(--no); }
  .addr { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .err { color: var(--no); font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="replay-badge">REPLAY</span>Guardrail <span>the same runaway agent, the same falling market</span></h1>
  <p class="label" id="label"></p>
  <div class="controls">
    <button id="play" type="button">Play</button>
    <input id="step" type="range" min="0" max="13" value="0" aria-label="step">
    <span id="stepn" class="addr"></span>
    <label class="addr" for="right">compare with</label>
    <select id="right"></select>
  </div>
  <div class="cols">
    <section class="panel" id="left"></section>
    <section class="panel" id="rightp"></section>
  </div>
  <p class="label" id="agent"></p>
</div>
<script type="module" src="./replay.js?v=2"></script>
</body>
</html>
