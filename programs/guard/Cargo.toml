[package]
name = "guard"
version = "0.1.0"
description = "Guardrail: limits your AI trading agent cannot trade past, as the delegate of a Velocity perps account."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "guard"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"

[dev-dependencies]
proptest = "1"

[lints.rust]
# Anchor 0.31's macros reference cfg features (anchor-debug, custom-heap, custom-panic) this crate does not declare.
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
