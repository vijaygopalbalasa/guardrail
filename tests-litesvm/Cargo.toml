[package]
name = "guardrail-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: LiteSVM runs Velocity's real devnet binary (fixtures/velocity-devnet.so) with cloned devnet state.
[workspace]

[dependencies]
litesvm = "=0.18.2"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"
solana-account = "4.7"
solana-address = { version = "2.7", features = ["curve25519", "sha2", "decode", "copy", "atomic"] }
solana-clock = "3.2"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-message = "4.6"
solana-signer = "3.0"
solana-transaction = "4.3"
solana-transaction-error = "3.4"
solana-instruction-error = "*"
